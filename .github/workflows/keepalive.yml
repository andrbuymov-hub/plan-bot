name: Keepalive

# GitHub отключает scheduled-воркфлоу после 60 дней без коммитов.
# Этот воркфлоу коммитит раз в месяц, чтобы расписания не умирали.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%F)"
          git push
