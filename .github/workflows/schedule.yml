name: Bot schedule

on:
  schedule:
    # 18:00 Asia/Novokuznetsk (UTC+7) = 11:00 UTC
    - cron: "0 11 * * *"
    # 09:00 Mon-Fri Asia/Novokuznetsk = 02:00 UTC
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  evening:
    if: github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python run_cron.py evening
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SHEET_ID: 1v1ckAB5VTzs2KpAgcJyPDg10c1u5INYo04Y-98j2FhA
          SHEET_GID: "1120480242"
          TIMEZONE: Asia/Novokuznetsk
          CHAT_PLANNING_ID: ${{ secrets.CHAT_PLANNING_ID }}
          CHAT_MORNING_ID: ${{ secrets.CHAT_MORNING_ID }}

  morning:
    if: github.event.schedule == '0 2 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python run_cron.py morning
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SHEET_ID: 1v1ckAB5VTzs2KpAgcJyPDg10c1u5INYo04Y-98j2FhA
          SHEET_GID: "1120480242"
          TIMEZONE: Asia/Novokuznetsk
          CHAT_PLANNING_ID: ${{ secrets.CHAT_PLANNING_ID }}
          CHAT_MORNING_ID: ${{ secrets.CHAT_MORNING_ID }}
